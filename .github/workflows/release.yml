name: Release (Windows Standalone)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build StandaloneWindows64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preflight Unity License
        id: preflight
        shell: bash
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          missing=()
          [ "$HAS_LICENSE" = "true" ] || missing+=(UNITY_LICENSE)
          [ "$HAS_EMAIL" = "true" ] || missing+=(UNITY_EMAIL)
          [ "$HAS_PASSWORD" = "true" ] || missing+=(UNITY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Unity License Secrets Missing::Cannot build release. Missing secrets: ${missing[*]}"
            echo "BLOCKED: Packaging cannot run until repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD are configured."
            exit 1
          fi
          echo "Unity credentials present."

      - name: Build StandaloneWindows64
        if: steps.preflight.outcome == 'success'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.0f1
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: LaneWeaver

      - name: Package Zip
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r ../../LaneWeaver-Windows64.zip .

      - name: Attach to Release
        if: steps.preflight.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: LaneWeaver-Windows64.zip
          tag_name: ${{ github.ref_name }}
